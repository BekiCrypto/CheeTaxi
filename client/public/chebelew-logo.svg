<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Deep Premium Mobility Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Kinetic Electric Velocity Gradient (Emerald to Cyan) -->
    <linearGradient id="kineticGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Ethiopian Heritage Solar Ribbon (Green, Gold, Red) -->
    <linearGradient id="ethioRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Radiant Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield Icon Container -->
  <rect x="6" y="6" width="188" height="188" rx="44" fill="url(#bgGrad)" stroke="#334155" stroke-width="2.5" filter="url(#shadow)"/>
  
  <!-- Subtle Internal Grid Track (Urban Roads & Navigation) -->
  <circle cx="100" cy="92" r="66" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="100" cy="92" r="50" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.4"/>

  <!-- Ethiopian Flag Heritage Accent Arc on Top Right -->
  <path d="M 62 42 Q 100 24 138 42" fill="none" stroke="url(#ethioRibbon)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Dynamic Aerodynamic 'C' and Forward Velocity Chevron -->
  <!-- Wing 1: Upper Kinetic Arc -->
  <path d="M 134 68 C 122 55 104 48 85 52 C 60 58 44 80 44 104 C 44 126 59 146 82 151 C 102 155 122 148 135 133" 
        fill="none" 
        stroke="url(#kineticGrad)" 
        stroke-width="14" 
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Wing 2: Speed Arrow / Modern Transport Dart Through Center -->
  <path d="M 78 92 L 138 92 M 120 74 L 144 92 L 120 110" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Energy Pulse Dot at Apex -->
  <circle cx="144" cy="92" r="4.5" fill="#38BDF8" filter="url(#glow)"/>

  <!-- Modern Mobility Typography: CHEBELEW ቼበለው -->
  <text x="100" y="166" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3.5">
    CHEBELEW
  </text>
  <text x="100" y="181" font-family="'Noto Sans Ethiopic', 'Abyssinica SIL', sans-serif" font-size="11.5" font-weight="800" fill="#F59E0B" text-anchor="middle" letter-spacing="1.5">
    ቼበለው
  </text>
</svg>
