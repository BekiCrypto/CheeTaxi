<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#149d9f"/>
      <stop offset="100%" stop-color="#0e7e81"/>
    </linearGradient>
    <linearGradient id="ethioGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Ethiopian Accent Strip -->
  <path d="M 22 28 Q 50 20 78 28" fill="none" stroke="url(#ethioGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Stylized Speed Taxi Icon -->
  <path d="M 26 56 L 34 40 L 66 40 L 74 56 Z" fill="#ffffff" opacity="0.95"/>
  <rect x="42" y="34" width="16" height="6" rx="2" fill="#f59e0b"/>
  <text x="50" y="39" font-size="4" font-weight="bold" fill="#ffffff" text-anchor="middle">TAXI</text>
  
  <!-- Wheels -->
  <circle cx="35" cy="58" r="6" fill="#1e293b" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="65" cy="58" r="6" fill="#1e293b" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="35" cy="58" r="2" fill="#f59e0b"/>
  <circle cx="65" cy="58" r="2" fill="#f59e0b"/>

  <!-- Motion Speed lines -->
  <path d="M 16 46 L 22 46 M 14 52 L 20 52 M 18 58 L 24 58" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Amharic text -->
  <text x="50" y="76" font-family="'Noto Sans Ethiopic', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">ከበለው</text>
  <text x="50" y="85" font-family="sans-serif" font-size="5.5" font-weight="700" fill="#e0f2fe" text-anchor="middle" letter-spacing="1">CHEBELEW</text>
</svg>
