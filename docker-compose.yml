services:
  chebelew-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chebelew-mobility-platform
    restart: unless-stopped
    expose:
      - "4000"
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/chebelew.db
    volumes:
      - chebelew_data:/app/data
    networks:
      - trustlotto_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  chebelew_data:
    driver: local

networks:
  trustlotto_default:
    external: true
