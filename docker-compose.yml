services:
  chebelew-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chebelew-mobility-platform
    restart: unless-stopped
    expose:
      - "4000"
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/chebelew.db
    volumes:
      - chebelew_data:/app/data
    networks:
      - trustlotto_default
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  chebelew_data:
    driver: local

networks:
  trustlotto_default:
    external: true
